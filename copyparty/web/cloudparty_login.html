<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>CloudParty - Login</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a1929">
    <style>
        :root {
            --bg-primary: #0a1929;
            --bg-secondary: #0d1117;
            --bg-card: #132f4c;
            --bg-input: #1e3a5f;
            --text-primary: #e3f2fd;
            --text-secondary: #90caf9;
            --accent: #42a5f5;
            --accent-hover: #64b5f6;
            --error: #f44336;
            --success: #4caf50;
            --border: #1e3a5f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
        }

        .login-container {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 48px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .logo p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-input);
            border: 2px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(66, 165, 245, 0.2);
        }

        .form-group input::placeholder {
            color: rgba(144, 202, 249, 0.5);
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-login:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(66, 165, 245, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .error-message {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 14px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .footer {
            text-align: center;
            margin-top: 32px;
            color: var(--text-secondary);
            font-size: 12px;
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
        }

        /* Icon for inputs */
        .input-icon {
            position: relative;
        }

        .input-icon svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            fill: var(--text-secondary);
        }

        .input-icon input {
            padding-left: 48px;
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 16px;
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>☁️ CloudParty</h1>
            <p>Secure File Sharing Server</p>
        </div>

        <div id="error-msg" class="error-message">
            {{ error_msg if error_msg else '' }}
        </div>

        <form id="login-form" method="post" enctype="multipart/form-data" action="{{ r }}/">
            <input type="hidden" name="act" value="login" />
            
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    <input type="text" id="username" name="uname" placeholder="Enter your username" required autofocus />
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-icon">
                    <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                    <input type="password" id="password" name="cppwd" placeholder="Enter your password" required />
                </div>
            </div>

            <input type="hidden" name="uhash" value="-" />
            <button type="submit" class="btn-login">Sign In</button>
        </form>

        <div class="footer">
            <p>Powered by <a href="https://github.com/9001/copyparty" target="_blank">copyparty</a></p>
        </div>
    </div>

    <script>
        // Show error if present
        var errorEl = document.getElementById('error-msg');
        if (errorEl && errorEl.textContent.trim()) {
            errorEl.classList.add('show');
        }

        // Check for error in URL
        var urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error')) {
            errorEl.textContent = decodeURIComponent(urlParams.get('error'));
            errorEl.classList.add('show');
        }

        // Debug: Log form submission
        document.getElementById('login-form').addEventListener('submit', function(e) {
            console.log('Form submitting with:');
            console.log('Username:', document.getElementById('username').value);
            console.log('Password:', document.getElementById('password').value ? '***' : 'EMPTY');
            console.log('Action:', document.querySelector('input[name="act"]').value);
            console.log('uhash:', document.querySelector('input[name="uhash"]').value);
        });
    </script>
</body>
</html>
