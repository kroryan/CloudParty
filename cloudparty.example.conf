# ============================================================
# CloudParty Configuration File - SECURITY HARDENED
# ============================================================
#
# IMPORTANT SECURITY NOTES:
# 1. NEVER use weak passwords like "1234" or "admin"
# 2. ALWAYS change default credentials before deployment
# 3. Review and understand each security flag before disabling
# 4. Keep this file readable only by your user (chmod 600 on Linux)
# 5. Consider using HTTPS with valid certificates for production
#
# Copy this file to cloudparty.conf and modify as needed
# -*- mode: yaml -*-
#
# Last Updated: 2026-01-19
# Security Review: Enhanced with defense-in-depth approach
# ============================================================

# ============================================================
# GLOBAL SECURITY SETTINGS
# ============================================================
[global]
  # ============================================================
  # NETWORK CONFIGURATION
  # ============================================================

  # Port(s) to listen on (comma-separated for multiple)
  # SECURITY: Use non-standard ports to reduce automated scans
  # Default: 3923 (consider changing for production)
  p: 3923

  # Interface to bind to
  # CRITICAL SECURITY: Choose based on your deployment scenario
  #
  # :: (default)     = Binds to ALL IPv4/IPv6 interfaces
  #                    ⚠️ DANGER: Exposes server to the internet if not firewalled
  #                    Use ONLY if behind a properly configured firewall/reverse proxy
  #
  # 127.0.0.1        = Localhost only (most secure for local use)
  #                    ✓ RECOMMENDED for development or reverse proxy setups
  #
  # 0.0.0.0          = All IPv4 interfaces only
  #                    ⚠️ WARNING: Same risks as "::" but IPv4 only
  #
  # 192.168.x.x      = Specific LAN interface
  #                    ✓ RECOMMENDED for trusted local network sharing only
  #
  i: 127.0.0.1

  # ============================================================
  # PRIVACY & SECURITY FLAGS
  # ============================================================

  # Hide server info headers (prevents version fingerprinting)
  # SECURITY: Reduces information disclosure to attackers
  nih

  # Prevent search engine indexing
  # SECURITY: Keeps your file server out of Google/Bing
  no-robots

  # Vague 403 errors (don't reveal if files exist)
  # SECURITY: Prevents enumeration of directory structure
  vague-403

  # Don't store IP addresses in database (GDPR compliance)
  # PRIVACY: Protects user privacy, but reduces audit trail
  # NOTE: Comment out if you need IP logging for security audits
  no_db_ip

  # Don't log failed password attempts in plain text
  # SECURITY: Prevents password leakage in logs
  no-logpass

  # ============================================================
  # FILE HANDLING & INTEGRITY
  # ============================================================

  # Enable file indexing and scanning on startup
  # PERFORMANCE: Can be slow on large volumes
  # SECURITY: Helps detect unauthorized file changes
  e2dsa

  # Verify file integrity on startup
  # SECURITY: Detects corrupted or tampered files
  # WARNING: Increases startup time significantly
  # e2v

  # Enable multimedia indexing with tag extraction
  # FEATURE: Better search and metadata
  e2ts

  # Better MIME type detection using magic bytes
  # SECURITY: Prevents MIME-type confusion attacks
  rmagic

  # ============================================================
  # ACCESS CONTROL
  # ============================================================

  # Require authentication for all access (disable anonymous)
  # SECURITY: Forces login for all operations
  # NOTE: This is enforced by not using "*" in volume permissions

  # Enable account password hashing
  # CRITICAL SECURITY: Hash passwords using Argon2/Scrypt
  # FORMAT: username: {hash_type}hash_value
  # Generate with: python -m copyparty.pwhash argon2 your_password

  # ============================================================
  # NETWORK DISCOVERY (Disable for security)
  # ============================================================

  # Enable zeroconf/mDNS network discovery
  # SECURITY WARNING: Announces server presence on local network
  # RECOMMENDED: Disable in production, enable only for home LAN
  # z

  # Enable QR code for easy mobile access
  # SECURITY: Convenience vs security tradeoff
  # RECOMMENDED: Disable if server URL contains credentials
  # qr

  # ============================================================
  # UI/UX CONFIGURATION
  # ============================================================

  # Start with console hidden (tray app mode)
  start_hidden: true

  # Theme: cloudparty (dark blue/black theme)
  # Options: cloudparty, 0 (light), 1 (dark)
  theme: cloudparty

# ============================================================
# ACCOUNTS - USER AUTHENTICATION
# ============================================================
#
# ⭐ FIRST-TIME SETUP (NEW FEATURE):
#
# When you first start CloudParty, you'll be automatically redirected
# to a setup page where you can create your admin account securely.
#
# The password you create will be automatically hashed using Argon2,
# a state-of-the-art password hashing algorithm that's resistant to
# GPU cracking attacks.
#
# NO NEED TO MANUALLY EDIT THIS FILE FOR INITIAL SETUP!
#
# ============================================================
#
# MANUAL ACCOUNT MANAGEMENT (Advanced):
#
# You can also add accounts manually by editing this file:
#
# 1. PASSWORD HASHING (AUTOMATIC):
#    CloudParty now automatically hashes plain-text passwords!
#    Simply add: admin: YourPassword123!
#    It will be converted to: admin: {argon2}$argon2id$...
#
# 2. PRE-HASHED PASSWORDS (Manual):
#    Generate hash:
#    python -m copyparty.pwhash argon2 YourStrongPassword123!
#
#    Then use in config:
#    admin: {argon2}$argon2id$v=19$m=65536,t=3,p=4$...
#
# 3. ACCOUNT TYPES:
#    - admin: Full access to admin panel and all volumes
#    - Regular users: Access based on volume permissions
#
# 4. USERNAME RESTRICTIONS:
#    - No colons (:) or spaces
#    - Use alphanumeric + underscore/dash only
#    - Reserved: "leeloo_dallas" (internal system account)
#
# 5. PASSWORD STRENGTH REQUIREMENTS:
#    - Minimum 8 characters
#    - Mix of uppercase, lowercase, numbers, and symbols
#    - Never use common passwords like "admin", "password", "1234"
#
# ============================================================
[accounts]
  # On first run, CloudParty will guide you through creating the admin account
  # via the web setup interface. No manual configuration needed!

  # Example additional users (uncomment and modify after initial setup):
  # john: SecurePassword456!
  # guest: GuestPass789@

  # Example read-only user:
  # viewer: ViewOnlyPass123#

# ============================================================
# VOLUMES - SHARED FOLDER CONFIGURATION
# ============================================================
#
# SECURITY BEST PRACTICES:
#
# 1. PRINCIPLE OF LEAST PRIVILEGE:
#    - Give users only the permissions they absolutely need
#    - Avoid "*" (anonymous access) unless truly public
#    - Separate sensitive data into different volumes
#
# 2. PERMISSION TYPES:
#    r    = Read (list folders, download files)
#    w    = Write (upload files only, can't read)
#    rw   = Read + Write (most common for trusted users)
#    m    = Move files/folders (requires w at destination)
#    d    = Delete files/folders
#    rwmd = Full user access (read, write, move, delete)
#    a    = Admin access (see IPs, reload config)
#    g    = Get (download only, no folder listing - stealth mode)
#
# 3. USER SPECIFIERS:
#    *         = Everyone, including anonymous/unauthenticated
#                ⚠️ SECURITY RISK: Use with caution!
#    username  = Specific authenticated user
#    user1 user2 = Multiple users (space-separated)
#
# 4. PATH SECURITY:
#    - Use absolute paths: D:/Archivos NOT D:/Archivos/../
#    - Verify paths exist and have correct OS permissions
#    - Never point to system directories like C:/Windows
#    - Use dedicated folders for shared content
#
# ============================================================

# ============================================================
# EXAMPLE VOLUME 1: Private Admin-Only Files
# ============================================================
# Recommended for: Configuration backups, sensitive documents
# Security Level: HIGH - No anonymous access
[/admin-private]
  # Change to your actual folder path
  D:/CloudParty/Admin

  accs:
    rwmd: admin      # Only admin has full access

  flags:
    e2d              # Enable database for this volume
    e2ds             # Scan for new files on startup
    nodupe           # Reject duplicate file uploads
    magic            # Detect file types for nameless uploads

# ============================================================
# EXAMPLE VOLUME 2: Shared Files (Authenticated Users)
# ============================================================
# Recommended for: Team collaboration, shared projects
# Security Level: MEDIUM - Requires authentication
[/shared]
  # Change to your actual folder path
  D:/CloudParty/Shared

  accs:
    r: admin         # Admin can read
    rw: admin        # Admin can read/write
    # Add other users as needed:
    # r: john jane    # john and jane can read
    # w: john          # john can upload

  flags:
    e2d              # Enable database
    nodupe           # Prevent duplicate uploads
    e2t              # Extract media tags

# ============================================================
# EXAMPLE VOLUME 3: Public Read-Only Files
# ============================================================
# Recommended for: Public documentation, downloads
# Security Level: LOW - Anonymous read access
# ⚠️ WARNING: Anyone can access these files without login
[/public]
  # Change to your actual folder path
  D:/CloudParty/Public

  accs:
    r: *             # ⚠️ SECURITY: Everyone can read (even anonymous)
    rw: admin        # Only admin can upload/modify

  flags:
    e2d              # Enable database
    no_dirsz         # Don't calculate folder sizes (performance)

# ============================================================
# EXAMPLE VOLUME 4: Write-Only Upload Drop Box
# ============================================================
# Recommended for: Anonymous file submissions, guest uploads
# Security Level: MEDIUM - Write-only, blind upload
# ⚠️ WARNING: Monitor disk space - anyone can upload
[/dropbox]
  # Change to your actual folder path
  D:/CloudParty/Dropbox

  accs:
    w: *             # ⚠️ SECURITY: Everyone can upload (write-only)
    rwmd: admin      # Only admin can see and manage files

  flags:
    e2d              # Enable database to track uploads
    nodupe           # Reject duplicate files (saves space)
    magic            # Auto-detect file types
    # Consider adding file size limits via other means

# ============================================================
# EXAMPLE VOLUME 5: Stealth Download Links (No Listing)
# ============================================================
# Recommended for: Direct download links without browsing
# Security Level: MEDIUM - Files accessible only via direct URL
[/downloads]
  # Change to your actual folder path
  D:/CloudParty/Downloads

  accs:
    g: *             # "Get" permission: Download only, no directory listing
    rwmd: admin      # Admin can manage

  flags:
    e2d              # Enable database
    nolist           # Completely hide folder structure

# ============================================================
# DEPLOYMENT CHECKLIST
# ============================================================
#
# Before deploying to production, complete this checklist:
#
# [ ] 1. CHANGE ALL DEFAULT PASSWORDS
#       Replace "CHANGE_ME_IMMEDIATELY_USE_STRONG_PASSWORD"
#       Use strong passwords (20+ chars, mixed case, numbers, symbols)
#
# [ ] 2. REVIEW INTERFACE BINDING (i:)
#       Set to 127.0.0.1 if behind reverse proxy
#       Set to specific LAN IP if on trusted network only
#       NEVER use :: or 0.0.0.0 on public internet without firewall
#
# [ ] 3. ENABLE PASSWORD HASHING
#       Generate hashed passwords:
#       python -m copyparty.pwhash argon2 YourPassword
#
# [ ] 4. REVIEW VOLUME PERMISSIONS
#       Remove all "*" (anonymous) access unless absolutely needed
#       Apply principle of least privilege
#
# [ ] 5. ENABLE SECURITY FLAGS
#       Ensure nih, no-robots, vague-403 are enabled
#
# [ ] 6. CONFIGURE FIREWALL
#       Allow only port 3923 (or your chosen port)
#       Block direct access if using reverse proxy
#
# [ ] 7. SET FILE PERMISSIONS
#       Windows: Right-click cloudparty.conf → Properties → Security
#                Remove all users except your account
#       Linux:   chmod 600 cloudparty.conf
#
# [ ] 8. CONSIDER HTTPS
#       Use reverse proxy (nginx/apache) with Let's Encrypt
#       Or use CloudParty's built-in TLS (see docs)
#
# [ ] 9. BACKUP CONFIGURATION
#       Keep encrypted backup of cloudparty.conf
#
# [ ] 10. MONITOR LOGS REGULARLY
#        Check for suspicious access patterns
#
# ============================================================
# QUICK START GUIDE
# ============================================================
#
# 1. COPY THIS FILE
#    Copy cloudparty.example.conf to cloudparty.conf
#    (Keep it in the same folder as CloudParty.exe)
#
# 2. MINIMAL SECURE CONFIGURATION
#    Modify these settings at minimum:
#    - [accounts] admin password
#    - [global] i: setting (interface binding)
#    - Volume paths (D:/YourPath)
#
# 3. START THE SERVER
#    Double-click CloudParty.exe
#    Icon appears in system tray
#
# 4. ACCESS WEB INTERFACE
#    Open browser: http://localhost:3923/
#    Login with admin credentials
#
# 5. SYSTEM TRAY MENU (Right-click icon)
#    - Open in Browser: Launch web interface
#    - Reload Config: Apply configuration changes
#    - Show/Hide Console: View server logs
#    - Exit: Shut down server
#
# ============================================================
# ADVANCED OPTIONS REFERENCE
# ============================================================
#
# === GLOBAL FLAGS ===
#
# Security & Privacy:
#   nih              Hide server info headers
#   no-robots        Prevent search engine indexing
#   vague-403        Hide file existence in errors
#   no_db_ip         Don't log IP addresses (GDPR)
#   no-logpass       Don't log password attempts
#   rmagic           Better MIME detection (security)
#
# Performance:
#   e2dsa            Enable file indexing on startup
#   e2ts             Enable multimedia tag extraction
#   e2v              Verify file integrity (slow)
#   j: N             Max N concurrent uploads
#
# Network:
#   p: 3923,8080     Multiple ports
#   i: 127.0.0.1     Localhost only
#   i: 192.168.1.5   Specific IP
#
# Features:
#   z                Zeroconf/mDNS (LAN discovery)
#   qr               Show QR code
#
# === VOLUME FLAGS ===
#
# Database & Indexing:
#   e2d              Enable database for this volume
#   e2ds             Scan for new files on startup
#   e2t              Extract media tags (music, video)
#   e2ts             Tag scanning + thumbnails
#
# Upload Control:
#   nodupe           Reject duplicate files (by hash)
#   magic            Auto-detect file type for uploads
#   gz               Allow gzip compression
#   hardlink         Use hardlinks for deduplication
#
# Access Control:
#   dots             Allow dotfiles (.htaccess, .git, etc)
#   nolist           Hide directory listing
#   no_dirsz         Don't calculate folder sizes (faster)
#
# Advanced:
#   lifetime: 3600   Auto-delete files after N seconds
#   maxsize: 1G      Max upload size (G=GB, M=MB, K=KB)
#
# ============================================================
# COMMON USE CASES
# ============================================================
#
# === USE CASE 1: Personal Cloud (Localhost + VPN) ===
# Most secure for personal use, access via VPN
#
# [global]
#   p: 3923
#   i: 127.0.0.1     # Localhost only
#   nih
#   no-robots
#   vague-403
#
# [accounts]
#   admin: {argon2}...
#
# [/files]
#   D:/MyFiles
#   accs:
#     rwmd: admin
#
# === USE CASE 2: Home LAN File Server ===
# Access from devices on your home network
#
# [global]
#   p: 3923
#   i: 192.168.1.100  # Your server's LAN IP
#   z                 # Enable network discovery
#   qr                # Show QR code for mobile
#   nih
#   vague-403
#
# [accounts]
#   admin: {argon2}...
#   family: {argon2}...
#
# [/shared]
#   D:/FamilyFiles
#   accs:
#     rw: admin family
#
# === USE CASE 3: Public File Sharing (Behind Reverse Proxy) ===
# Expose to internet securely via nginx/apache with HTTPS
#
# [global]
#   p: 3923
#   i: 127.0.0.1     # Only reverse proxy can access
#   nih
#   no-robots
#   vague-403
#   no_db_ip         # GDPR compliance
#
# [accounts]
#   admin: {argon2}...
#
# [/public]
#   D:/PublicFiles
#   accs:
#     r: *           # Anonymous read
#     rwmd: admin
#   flags:
#     e2d
#     nodupe
#
# === USE CASE 4: Anonymous Upload Drop Box ===
# Accept uploads from anyone, admin reviews later
#
# [/dropbox]
#   D:/Uploads
#   accs:
#     w: *           # Anyone can upload (write-only)
#     rwmd: admin    # Only admin can see files
#   flags:
#     e2d
#     nodupe
#     magic
#     maxsize: 100M  # Limit upload size
#
# ============================================================
# HTTPS / TLS CONFIGURATION
# ============================================================
#
# For production, ALWAYS use HTTPS. Two options:
#
# OPTION 1: Reverse Proxy (RECOMMENDED)
#   Use nginx/apache/caddy with Let's Encrypt
#   Set CloudParty to i: 127.0.0.1
#   Reverse proxy handles TLS termination
#
# OPTION 2: Built-in TLS
#   Add to [global]:
#   ssl: true
#   ssl-cert: /path/to/fullchain.pem
#   ssl-key: /path/to/privkey.pem
#
#   Generate self-signed cert (testing only):
#   openssl req -x509 -newkey rsa:4096 -nodes \
#     -keyout key.pem -out cert.pem -days 365
#
# ============================================================
# REVERSE PROXY CONFIGURATION EXAMPLES
# ============================================================
#
# === NGINX ===
# server {
#     listen 443 ssl http2;
#     server_name files.yourdomain.com;
#
#     ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
#
#     location / {
#         proxy_pass http://127.0.0.1:3923;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#
#         # Large file uploads
#         client_max_body_size 10G;
#         proxy_request_buffering off;
#     }
# }
#
# === APACHE ===
# <VirtualHost *:443>
#     ServerName files.yourdomain.com
#
#     SSLEngine on
#     SSLCertificateFile /etc/letsencrypt/live/yourdomain.com/fullchain.pem
#     SSLCertificateKeyFile /etc/letsencrypt/live/yourdomain.com/privkey.pem
#
#     ProxyPreserveHost On
#     ProxyPass / http://127.0.0.1:3923/
#     ProxyPassReverse / http://127.0.0.1:3923/
#
#     # Large file uploads
#     LimitRequestBody 10737418240
# </VirtualHost>
#
# ============================================================
# TROUBLESHOOTING & SECURITY
# ============================================================
#
# PROBLEM: Can't access server from other devices
# SOLUTION: Check interface binding (i:) and firewall rules
#           Use i: 0.0.0.0 or specific LAN IP, not 127.0.0.1
#
# PROBLEM: "Access denied" errors
# SOLUTION: Check volume permissions (accs:)
#           Ensure user has required permission (r/w/rw)
#
# PROBLEM: Weak password warning
# SOLUTION: Use strong passwords (20+ chars) or hashed passwords
#           python -m copyparty.pwhash argon2 YourPassword
#
# PROBLEM: Files accessible without login
# SOLUTION: Remove "*" from volume accs:
#           Use specific usernames only
#
# PROBLEM: Server visible on internet
# SOLUTION: Check interface binding, configure firewall
#           Use i: 127.0.0.1 and access via VPN or reverse proxy
#
# PROBLEM: Suspicious login attempts
# SOLUTION: Enable no_db_ip, review logs, use strong passwords
#           Consider IP whitelist at firewall level
