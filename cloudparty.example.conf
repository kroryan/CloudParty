# CloudParty Configuration File
# Copy this file to cloudparty.conf and modify as needed
# -*- mode: yaml -*-

# ============================================================
# GLOBAL SETTINGS
# ============================================================
[global]
  # Port(s) to listen on (comma-separated for multiple)
  p: 3923
  
  # Interface to bind to (:: = all IPv4/IPv6, 0.0.0.0 = all IPv4)
  i: ::
  
  # Start with console hidden (tray app mode)
  start_hidden: true
  
  # Theme: cloudparty (dark blue/black theme)
  theme: cloudparty
  
  # Enable file indexing and scanning
  e2dsa
  
  # Enable multimedia indexing  
  e2ts
  
  # Enable zeroconf network discovery (advertise on local network)
  z
  
  # Enable QR code for easy mobile access  
  qr

# ============================================================
# ACCOUNTS
# Define users with username: password format
# ============================================================
[accounts]
  admin: 1234
  # Add more users as needed:
  # username: password

# ============================================================
# VOLUMES
# Define shared folders with access permissions
# Format: [/mount_path] followed by local path and settings
# ============================================================

# Root volume - main shared folder
# Change D:/Archivos to your actual folder path
[/archivos]
  D:/Archivos
  accs:
    r: *         # Everyone can read (anonymous access)
    rw: admin    # Admin can read/write

# Example: Private folder only for admin
# Uncomment and modify as needed:
# [/private]
#   D:/Private
#   accs:
#     rw: admin

# Example: Public upload folder where anyone can upload
# [/uploads]
#   D:/Uploads
#   accs:
#     w: *         # Everyone can write/upload
#     rw: admin    # Admin can read/write
#   flags:
#     e2d          # Enable uploads database
#     nodupe       # Reject duplicate uploads

# ============================================================
# PERMISSION REFERENCE
# ============================================================
# 
# Permission types:
#   r   = read (list folders, download files)
#   w   = write (upload files only)
#   rw  = read + write
#   m   = move files/folders (requires w at destination)
#   d   = delete files/folders
#   g   = get (download files, but can't see folder listing)
#   a   = admin access (see IPs, reload config)
#   A   = all permissions (rwmda)
#   *   = everyone (including anonymous/unauthenticated)
#
# ============================================================
# HOW TO USE
# ============================================================
#
# 1. Copy this file to cloudparty.conf (same folder as exe)
# 2. Modify the settings above:
#    - Change ports if needed
#    - Add your user accounts
#    - Configure your shared folders
# 3. Double-click cloudparty.exe to start
# 4. The tray icon will appear in your system tray
#
# Tray icon options (right-click):
#   - Show/Hide Console: Toggle the console window
#   - Open in Browser: Open the web interface
#   - Reload Config: Reload this configuration file
#   - Exit: Shut down CloudParty
#
# ============================================================
# ADVANCED OPTIONS
# ============================================================
#
# For more options, see the full documentation:
# https://github.com/9001/copyparty
#
# Common flags to add in [global]:
#   no-robots     # Prevent search engine indexing
#   nih           # No info headers (privacy)
#   vague-403     # Don't reveal if files exist (security)
#
