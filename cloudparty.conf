# ============================================================
# CloudParty Configuration File
# ============================================================
# This is a fresh installation. When you first visit the web
# interface, you'll be guided through creating your admin account.
#
# Your password will be automatically encrypted using Argon2.
# ============================================================

[global]
  p: 3923
  i: 0.0.0.0
  theme: cloudparty
  start_hidden: true
  e2dsa
  e2ts
  nih
  no-robots
  vague-403
  rmagic

# ============================================================
# ACCOUNTS
# ============================================================
# On first run, visit http://localhost:3923 and you will be
# redirected to the setup wizard to create your admin account.
[accounts]
  # Temporary placeholder - will trigger setup wizard on first access
  admin: CHANGE_ME_IMMEDIATELY_USE_STRONG_PASSWORD
  first_login: true

# ============================================================
# VOLUMES
# ============================================================
# No volumes configured yet. You will set up your shared
# folders during the initial setup wizard after creating
# your admin account.
