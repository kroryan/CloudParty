# ============================================================
# CloudParty Configuration File - SECURITY HARDENED
# ============================================================
# WARNING: This file contains sensitive credentials
# Keep permissions restricted (Windows: User-only, Linux: chmod 600)
# Last Security Update: 2026-01-19
# ============================================================

[global]
  # ============================================================
  # NETWORK CONFIGURATION
  # ============================================================
  # Port to listen on
  p: 3923

  # Interface binding - SECURITY CRITICAL
  # Current: 127.0.0.1 (Localhost only - Most Secure)
  #
  # ⚠️ SECURITY WARNING: Previous config used "::" (all interfaces)
  #    which exposed your server to your entire network/internet
  #
  # Options:
  #   127.0.0.1       = Localhost only (RECOMMENDED for reverse proxy/VPN)
  #   192.168.x.x     = Specific LAN IP (for trusted home network)
  #   ::              = All interfaces (DANGEROUS - only if firewalled)
  #
  # Change to your LAN IP if you need local network access:
  i: 127.0.0.1

  # UI Configuration
  theme: cloudparty
  start_hidden: true

  # ============================================================
  # SECURITY FLAGS (Newly Added)
  # ============================================================

  # Hide server information headers (prevents version fingerprinting)
  nih

  # Prevent search engine indexing
  no-robots

  # Vague 403 errors (don't reveal if files exist - prevents enumeration)
  vague-403

  # Don't store IP addresses (GDPR compliance + privacy)
  # NOTE: Disable if you need IP logging for security audits
  no_db_ip

  # Don't log password attempts (prevents password leakage in logs)
  no-logpass

  # Better MIME type detection (prevents MIME confusion attacks)
  rmagic

  # ============================================================
  # FILE INDEXING & FEATURES
  # ============================================================

  # Enable file indexing and scanning on startup
  e2dsa

  # Enable multimedia tag extraction
  e2ts

  # ============================================================
  # NETWORK DISCOVERY - DISABLED FOR SECURITY
  # ============================================================
  #
  # Zeroconf/mDNS - Announces server on local network
  # SECURITY: Disabled by default (uncomment to enable on trusted LAN)
  # z

  # QR Code for mobile access
  # SECURITY: Disabled by default (uncomment if needed)
  # qr

# ============================================================
# ACCOUNTS - USER AUTHENTICATION
# ============================================================
#
# ⚠️ CRITICAL SECURITY ISSUE FIXED:
# Previous passwords were EXTREMELY WEAK:
#   admin: admin123  ← Easily cracked in seconds
#   guest: guest     ← Worst possible password
#
# IMMEDIATE ACTIONS REQUIRED:
# 1. Change these placeholder passwords NOW
# 2. Consider using password hashing:
#    python -m copyparty.pwhash argon2 YourStrongPassword
#    Then use: admin: {argon2}$argon2id$v=19$m=65536...
#
# ============================================================
[accounts]
  # ⚠️ TODO: CHANGE THIS PASSWORD IMMEDIATELY!
  # Use a strong password: 20+ chars, mixed case, numbers, symbols
  # Example: Tr0ub4dor&3_Correct-Horse-Battery-Staple
  admin: CHANGE_THIS_ADMIN_PASSWORD_NOW

  # ⚠️ TODO: CHANGE THIS GUEST PASSWORD OR REMOVE GUEST ACCOUNT
  # Consider: Do you really need a guest account?
  # If yes, use a strong password. If no, delete this line.
  guest: CHANGE_THIS_GUEST_PASSWORD_NOW

# ============================================================
# VOLUMES - SHARED FOLDERS
# ============================================================
#
# ⚠️ SECURITY ISSUE FIXED:
# Previous config used "r: *" which allowed ANONYMOUS access
# Anyone on your network could browse files without login!
#
# New config requires authentication for all access
#
# ============================================================

# ============================================================
# Root Volume - Main Shared Folder
# ============================================================
# Previous security level: LOW (anonymous read access)
# New security level: MEDIUM (authenticated access only)
[/]
  D:/Archivos
  accs:
    # ⚠️ SECURITY CHANGE: Removed "r: *" (anonymous access)
    # If you need anonymous read access, uncomment the line below
    # WARNING: Anyone without login can read these files!
    # r: *

    # Admin has read/write access
    rw: admin

    # Guest has read-only access (requires login)
    r: guest

  # Volume security flags
  flags:
    e2d              # Enable database for this volume
    nodupe           # Reject duplicate file uploads

# ============================================================
# Private Folder - Admin Only
# ============================================================
# Security level: HIGH (admin only)
[/private]
  D:/Private
  accs:
    rwmd: admin      # Admin has full access (read/write/move/delete)

  flags:
    e2d              # Enable database
    e2ds             # Scan for new files on startup
    nodupe           # Reject duplicates

# ============================================================
# SECURITY RECOMMENDATIONS
# ============================================================
#
# 1. CHANGE PASSWORDS ABOVE - Current passwords are placeholders!
#
# 2. REVIEW INTERFACE BINDING (i:)
#    - Current: 127.0.0.1 (localhost only)
#    - If you need LAN access, change to your computer's LAN IP
#    - Example: i: 192.168.1.100
#
# 3. CONSIDER PASSWORD HASHING
#    Generate hashed password:
#      python -m copyparty.pwhash argon2 YourPassword
#    Then replace plain text passwords with hashes
#
# 4. BACKUP THIS FILE SECURELY
#    Keep encrypted backup of this configuration
#
# 5. RESTRICT FILE PERMISSIONS
#    Windows: Properties → Security → Remove all users except you
#    Linux: chmod 600 cloudparty.conf
#
# 6. MONITOR LOGS REGULARLY
#    Check for suspicious activity via admin console
#
# 7. USE HTTPS IN PRODUCTION
#    Setup reverse proxy (nginx/apache) with Let's Encrypt
#    Or use CloudParty built-in TLS (see example.conf)
#
# ============================================================
